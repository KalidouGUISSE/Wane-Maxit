version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_DB: maxitsa
      POSTGRES_USER: kalidou
      POSTGRES_PASSWORD: kalidou
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-container
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  pgdata:
